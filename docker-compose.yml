services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dissecttune
      POSTGRES_PASSWORD: dissecttune
      POSTGRES_DB: dissecttune
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dissecttune"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ./backend
      args:
        INSTALL_DEMUCS: "false"
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg2://dissecttune:dissecttune@postgres:5432/dissecttune
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    command: sh -c "alembic upgrade head && python -m app.initialize && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEMUCS: ${INSTALL_DEMUCS:-true}
    env_file: .env
    environment: *backend-env
    depends_on:
      api: {condition: service_healthy}
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    volumes: ["model_cache:/root/.cache"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:
